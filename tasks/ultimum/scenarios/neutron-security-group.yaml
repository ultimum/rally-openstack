# One independent task, using the configured existing Rally user/project.
---
Ultimum.neutron_security_group:
  - args:
      config_path: {{ config_path | tojson }}
      state_path: {{ state_path | tojson }}
    runner:
      type: serial
      times: 1
    context:
      users: {}
    sla:
      failure_rate:
        max: 0
