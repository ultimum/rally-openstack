heat_template_version: 2016-10-14

description: >
  A server and a volume attached to it, both in the requested availability
  zones. Empty zone or volume type values keep the service defaults.

parameters:
  image:
    type: string
  flavor:
    type: string
  availability_zone:
    type: string
    description: Availability zone of the server.
    default: ""
  volume_availability_zone:
    type: string
    description: Availability zone of the volume.
    default: ""
  volume_type:
    type: string
    default: ""
  volume_size:
    type: number
    description: Size of the volume to be created.
    default: 1
    constraints:
      - range: { min: 1, max: 1024 }
        description: must be between 1 and 1024 Gb.

conditions:
  server_zone: { not: { equals: [{ get_param: availability_zone }, ""] } }
  volume_zone: { not: { equals: [{ get_param: volume_availability_zone }, ""] } }
  volume_type_set: { not: { equals: [{ get_param: volume_type }, ""] } }

resources:
  server:
    type: OS::Nova::Server
    properties:
      image: { get_param: image }
      flavor: { get_param: flavor }
      availability_zone:
        if: [server_zone, { get_param: availability_zone }, null]
      networks:
        - allocate_network: none
  cinder_volume:
    type: OS::Cinder::Volume
    properties:
      size: { get_param: volume_size }
      availability_zone:
        if: [volume_zone, { get_param: volume_availability_zone }, null]
      volume_type:
        if: [volume_type_set, { get_param: volume_type }, null]
  volume_attachment:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: cinder_volume }
      instance_uuid: { get_resource: server }
      mountpoint: /dev/vdc
