heat_template_version: 2016-10-14

description: >
  An autoscaling group of servers booted from volumes (Ultimum::BootServer,
  mapped to boot_server.yaml by the stack environment) in the requested
  availability zones and a scaling policy whose Heat API signal URL is the
  scaling_url output (signal_url: needs a Keystone token, no EC2
  credentials; the heat_signal.py plugin sends it).

parameters:
  flavor:
    type: string
    constraints:
      - custom_constraint: nova.flavor
  image:
    type: string
    constraints:
      - custom_constraint: glance.image
  availability_zone:
    type: string
    default: ""
  volume_availability_zone:
    type: string
    default: ""
  volume_type:
    type: string
    default: ""
  boot_volume_size:
    type: number
    default: 1
  scaling_adjustment:
    type: number
    default: 1
  max_size:
    type: number
    default: 5
    constraints:
      - range: { min: 1 }

resources:
  asg:
    type: OS::Heat::AutoScalingGroup
    properties:
      resource:
        type: Ultimum::BootServer
        properties:
          image: { get_param: image }
          flavor: { get_param: flavor }
          availability_zone: { get_param: availability_zone }
          volume_availability_zone: { get_param: volume_availability_zone }
          volume_type: { get_param: volume_type }
          boot_volume_size: { get_param: boot_volume_size }
      min_size: 1
      desired_capacity: 3
      max_size: { get_param: max_size }

  scaling_policy:
    type: OS::Heat::ScalingPolicy
    properties:
      adjustment_type: change_in_capacity
      auto_scaling_group_id: { get_resource: asg }
      scaling_adjustment: { get_param: scaling_adjustment }

outputs:
  scaling_url:
    value: { get_attr: [scaling_policy, signal_url] }
