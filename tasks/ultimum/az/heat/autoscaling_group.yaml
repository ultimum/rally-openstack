heat_template_version: 2016-10-14

description: >
  An autoscaling group of servers in the requested availability zone and
  a scaling policy whose signal URL is the scaling_url output.

parameters:
  flavor:
    type: string
    constraints:
      - custom_constraint: nova.flavor
  image:
    type: string
    constraints:
      - custom_constraint: glance.image
  availability_zone:
    type: string
    default: ""
  scaling_adjustment:
    type: number
    default: 1
  max_size:
    type: number
    default: 5
    constraints:
      - range: { min: 1 }

conditions:
  server_zone: { not: { equals: [{ get_param: availability_zone }, ""] } }

resources:
  asg:
    type: OS::Heat::AutoScalingGroup
    properties:
      resource:
        type: OS::Nova::Server
        properties:
          image: { get_param: image }
          flavor: { get_param: flavor }
          availability_zone:
            if: [server_zone, { get_param: availability_zone }, null]
          networks:
            - allocate_network: none
      min_size: 1
      desired_capacity: 3
      max_size: { get_param: max_size }

  scaling_policy:
    type: OS::Heat::ScalingPolicy
    properties:
      adjustment_type: change_in_capacity
      auto_scaling_group_id: { get_resource: asg }
      scaling_adjustment: { get_param: scaling_adjustment }

outputs:
  scaling_url:
    value: { get_attr: [scaling_policy, alarm_url] }
