{% set compute_az = availability_zone | tojson %}
{% set volume_az = volume_availability_zone | tojson %}
{% set vtype = volume_type | tojson %}
{% set zonal_volume = {"availability_zone": volume_availability_zone, "volume_type": volume_type} | tojson %}
{#- Workloads that boot servers get their own network: the project sees
    several networks (its own and shared ones), and Nova refuses to choose
    ("Multiple possible networks found"). #}
{% set network = {"router": {}, "network_create_args": network_create_args} | tojson %}
    -
      title: CinderVolumes.create_volume tests
      workloads:
        -
          scenario:
            CinderVolumes.create_volume:
              size: 1
              availability_zone: {{ volume_az }}
              volume_type: {{ vtype }}
          runner:
            constant:
              times: 2
              concurrency: 2
          contexts:
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
          sla:
            failure_rate:
              max: 50
        -
          description: "Create a volume from the specified image."
          scenario:
            CinderVolumes.create_volume:
              size: 1
              image:
                name: {{ image_name | tojson }}
              availability_zone: {{ volume_az }}
              volume_type: {{ vtype }}
          runner:
            constant:
              times: 2
              concurrency: 2
          contexts:
            users: {{ dict(project_users, users_per_tenant=1) | tojson }}
          sla:
            failure_rate:
              max: 50
    -
      title: Authenticate.validate_cinder tests
      scenario:
        Authenticate.validate_cinder:
          repetitions: 2
      runner:
        constant:
          times: 10
          concurrency: 5
      contexts:
        users: {{ dict(project_users, users_per_tenant=1) | tojson }}
{%- if project_quota_tests %}
    -
      title: Quotas.cinder_update_and_delete tests
      scenario:
        Quotas.cinder_update_and_delete:
          max_quota: 1024
      runner:
        constant:
          times: 4
          concurrency: 1
      contexts:
        users: {{ dict(project_users, users_per_tenant=1) | tojson }}
    -
      title: Quotas.cinder_update test
