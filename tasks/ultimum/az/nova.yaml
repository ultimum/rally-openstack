{% set compute_az = availability_zone | tojson %}
{% set zonal_server = {"availability_zone": availability_zone} | tojson %}
{% set zonal_volume = {"availability_zone": volume_availability_zone, "volume_type": volume_type} | tojson %}
{% set network = {"router": {}, "network_create_args": network_create_args} | tojson %}
{% set flavor = {"name": flavor_name} | tojson %}
{% set image = {"name": image_name} | tojson %}
{% set resize_flavor = {"name": resize_flavor_name} | tojson %}
    -
      title: Authenticate.validate_nova tests
      scenario:
        Authenticate.validate_nova:
          repetitions: 2
      runner:
        constant:
          times: 10
          concurrency: 5
      contexts:
        users: {{ dict(project_users, users_per_tenant=2) | tojson }}
    -
      title: Quotas test cases
      workloads:
{%- if project_quota_tests %}
        -
          scenario:
            Quotas.nova_update_and_delete:
              max_quota: 1024
          runner:
            constant:
              times: 4
              concurrency: 1
          contexts:
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
{%- endif %}
        -
          scenario:
            Quotas.nova_get: {}
          runner:
            constant:
              times: 4
              concurrency: 2
          contexts:
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
{%- if project_quota_tests %}
        -
          scenario:
            Quotas.nova_update:
              max_quota: 1024
          runner:
            constant:
              times: 4
              concurrency: 1
          contexts:
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
{%- endif %}
    -
      title: NovaServers.boot_and_delete_server tests
      workloads:
        -
          scenario:
            NovaServers.boot_and_delete_server:
              flavor: {{ flavor }}
              image: {{ image }}
              availability_zone: {{ compute_az }}
          runner:
            constant:
              times: 2
              concurrency: 2
          contexts:
            network: {{ network }}
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
        -
          scenario:
            NovaServers.boot_and_delete_server:
              flavor: {{ flavor }}
              image: {{ image }}
              auto_assign_nic: true
              availability_zone: {{ compute_az }}
          runner:
            constant:
              times: 2
              concurrency: 2
          contexts:
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
            network:
              start_cidr: "10.2.0.0/24"
              networks_per_tenant: 2
              network_create_args: {{ network_create_args | tojson }}
        -
          scenario:
            NovaServers.boot_and_delete_server:
              flavor: {{ flavor }}
              image: {{ image }}
              force_delete: true
              availability_zone: {{ compute_az }}
          runner:
            constant:
              times: 2
              concurrency: 2
          contexts:
            network: {{ network }}
            users: {{ dict(project_users, users_per_tenant=2) | tojson }}
    -
