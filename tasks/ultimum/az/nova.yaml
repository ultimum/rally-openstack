      sla:
        failure_rate:
          max: 50
    -
      title: NovaServers.boot_and_bounce_server tests
      scenario:
        NovaServers.boot_and_bounce_server:
          flavor: {{ flavor }}
          image: {{ image }}
          availability_zone: {{ compute_az }}
          actions:
            - hard_reboot: 1
            - stop_start: 1
            - rescue_unrescue: 1
            - pause_unpause: 1
            - suspend_resume: 1
            - lock_unlock: 1
            - shelve_unshelve: 1
      runner:
        constant:
          times: 2
          concurrency: 2
      contexts:
        network: {{ network }}
        # Rescuing a volume-backed server needs compute API 2.87.
        api_versions:
          nova:
            version: 2.87
        users: {{ dict(project_users, users_per_tenant=1) | tojson }}
