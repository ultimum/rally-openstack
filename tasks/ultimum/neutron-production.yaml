{% set image_name = image_name | default("^Cirros.*") %}
{% set flavor_name = flavor_name | default("m1.tiny") %}
{% set volume_type = volume_type | default("cz03") %}
{% set availability_zone = availability_zone | default("cz03") %}
---
version: 2
title: Ultimum Neutron Production Validation
description: >
  Small production validation suite for tenant networking. It avoids public
  networks and floating IPs, creates tenant networks/subnets/routers/ports
  and security groups, boots workloads in the requested Nova availability
  zone, and verifies boot-from-volume with the requested Cinder volume type
  and availability zone.

subtasks:
  - title: Tenant network lifecycle
    workloads:
      - scenario:
          NeutronNetworks.create_and_list_networks:
            network_create_args: {}
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          quotas:
            neutron:
              network: -1
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

      - scenario:
          NeutronNetworks.create_and_show_network:
            network_create_args: {}
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          quotas:
            neutron:
              network: -1
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

      - scenario:
          NeutronNetworks.create_and_update_networks:
            network_create_args: {}
            network_update_args:
              admin_state_up: false
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          quotas:
            neutron:
              network: -1
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

      - scenario:
          NeutronNetworks.create_and_delete_networks:
            network_create_args: {}
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          quotas:
            neutron:
              network: -1
              subnet: -1
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

