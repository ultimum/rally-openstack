  - title: VM on tenant networks in requested AZ
    scenario:
      NovaServers.boot_and_delete_server:
        flavor:
          name: {{ flavor_name }}
        image:
          name: {{ image_name }}
          list_kwargs:
            visibility: public
        auto_assign_nic: true
        availability_zone: {{ availability_zone }}
    contexts:
      users:
        tenants: 1
        users_per_tenant: 1
      quotas:
        neutron:
          network: -1
          subnet: -1
          router: -1
          port: -1
          security_group: -1
          security_group_rule: -1
        nova:
          instances: -1
          cores: -1
          ram: -1
      network:
        start_cidr: 10.248.0.0/24
        networks_per_tenant: 2
        subnets_per_network: 1
        router:
          external: false
    runner:
      constant:
        times: 1
        concurrency: 1
    sla:
      failure_rate:
        max: 0

  - title: Boot from volume on tenant network in requested AZ
    scenario:
      NovaServers.boot_server_from_volume_and_delete:
        flavor:
          name: {{ flavor_name }}
        image:
          name: {{ image_name }}
          list_kwargs:
            visibility: public
        volume_size: 1
        volume_type: {{ volume_type }}
        create_volume_kwargs:
          availability_zone: {{ availability_zone }}
        boot_server_kwargs:
          availability_zone: {{ availability_zone }}
          auto_assign_nic: true
    contexts:
      users:
        tenants: 1
        users_per_tenant: 1
      quotas:
        neutron:
          network: -1
          subnet: -1
          port: -1
        nova:
          instances: -1
          cores: -1
          ram: -1
        cinder:
          volumes: -1
          gigabytes: -1
      network:
        start_cidr: 10.251.0.0/24
        networks_per_tenant: 1
        subnets_per_network: 1
        router:
          external: false
    runner:
      constant:
        times: 1
        concurrency: 1
    sla:
      failure_rate:
        max: 0
