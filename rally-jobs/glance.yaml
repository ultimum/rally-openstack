{%- set cirros_image_url_qcow2 = "https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img" %}
{%- set cirros_image_url_raw = "/data/extra/cirros-0.6.3-x86_64-disk.raw" %}
---
version: 2
title: All Glance-related workload tests
description: >
  Consolidated Glance workloads covering Glance scenarios without
  Nova instance boot tests. Local RAW image is used for direct uploads,
  while web-download uses the official CirrOS HTTPS URL.

subtasks:
  - title: Authenticate.validate_glance tests
    scenario:
      Authenticate.validate_glance:
        repetitions: 2
    contexts:
      users:
        tenants: 3
        users_per_tenant: 5
    runner:
      constant:
        times: 10
        concurrency: 5
    sla:
      failure_rate:
        max: 0

  - title: GlanceImages.list_images tests
    workloads:
      - scenario:
          GlanceImages.list_images: {}
        contexts:
          users:
            tenants: 1
            users_per_tenant: 2
          images:
            image_url: '{{ cirros_image_url_qcow2 }}'
            disk_format: qcow2
            container_format: bare
            images_per_tenant: 1
        runner:
          constant:
            times: 5
            concurrency: 5
        sla:
          failure_rate:
            max: 0

      - scenario:
          GlanceImages.list_images: {}
        contexts:
          users:
            tenants: 2
            users_per_tenant: 1
          images:
            image_url: '{{ cirros_image_url_qcow2 }}'
            disk_format: qcow2
            container_format: bare
            images_per_tenant: 2
        runner:
          constant:
            times: 5
            concurrency: 5
        sla:
          failure_rate:
            max: 0

  - title: GlanceImages.create_and_list_image tests
    workloads:
      - description: Test qcow2 image
        scenario:
          GlanceImages.create_and_list_image:
            image_location: '{{ cirros_image_url_qcow2 }}'
            container_format: bare
            disk_format: qcow2
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

      - description: Test raw image
        scenario:
          GlanceImages.create_and_list_image:
            image_location: '{{ cirros_image_url_raw }}'
            container_format: bare
            disk_format: raw
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 0

  - title: GlanceImages.create_and_get_image tests
    scenario:
      GlanceImages.create_and_get_image:
        image_location: '{{ cirros_image_url_qcow2 }}'
        container_format: bare
        disk_format: qcow2
    contexts:
      users:
        tenants: 1
        users_per_tenant: 1
      api_versions:
        glance:
          version: 2
    runner:
      constant:
        times: 2
        concurrency: 2
    sla:
      failure_rate:
        max: 0

  - title: GlanceImages.create_and_delete_image tests
    workloads:
      - description: Delete a qcow2 image
        scenario:
          GlanceImages.create_and_delete_image:
            image_location: '{{ cirros_image_url_qcow2 }}'
            container_format: bare
            disk_format: qcow2
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
        runner:
          constant:
            times: 2
            concurrency: 2
        sla:
          failure_rate:
            max: 0

      - description: Delete a raw image
        scenario:
          GlanceImages.create_and_delete_image:
            image_location: '{{ cirros_image_url_raw }}'
            container_format: bare
            disk_format: raw
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
        runner:
          constant:
            times: 2
            concurrency: 2
        sla:
          failure_rate:
            max: 0

  - title: GlanceImages.create_and_update_image tests
    workloads:
      - description: Update min_disk and min_ram on an existing image
        scenario:
          GlanceImages.create_and_update_image:
            image_location: '{{ cirros_image_url_qcow2 }}'
            container_format: bare
            disk_format: qcow2
            update_min_disk: 1
            update_min_ram: 128
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 2
            concurrency: 2
        sla:
          failure_rate:
            max: 0

      - description: Create image with properties then remove them on update
        scenario:
          GlanceImages.create_and_update_image:
            image_location: '{{ cirros_image_url_qcow2 }}'
            container_format: bare
            disk_format: qcow2
            create_properties:
              custom_tag: rally_test
            remove_props:
              - custom_tag
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 2
            concurrency: 2
        sla:
          failure_rate:
            max: 0

  - title: GlanceImages.create_and_deactivate_image tests
    scenario:
      GlanceImages.create_and_deactivate_image:
        image_location: '{{ cirros_image_url_qcow2 }}'
        container_format: bare
        disk_format: qcow2
    contexts:
      users:
        tenants: 1
        users_per_tenant: 1
      api_versions:
        glance:
          version: 2
    runner:
      constant:
        times: 2
        concurrency: 2
    sla:
      failure_rate:
        max: 0

  - title: GlanceImages.create_and_download_image tests
    scenario:
      GlanceImages.create_and_download_image:
        image_location: '{{ cirros_image_url_qcow2 }}'
        container_format: bare
        disk_format: qcow2
    contexts:
      users:
        tenants: 1
        users_per_tenant: 1
      api_versions:
        glance:
          version: 2
    runner:
      constant:
        times: 2
        concurrency: 2
    sla:
      failure_rate:
        max: 0

  - title: GlanceImages.import_and_delete_image tests
    workloads:
      - description: glance-direct import of a local raw image
        scenario:
          GlanceImages.import_and_delete_image:
            image_location: '{{ cirros_image_url_raw }}'
            container_format: bare
            disk_format: raw
            import_method: glance-direct
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 100

      - description: web-download import from official CirrOS HTTPS URL
        scenario:
          GlanceImages.import_and_delete_image:
            image_location: '{{ cirros_image_url_qcow2 }}'
            container_format: bare
            disk_format: qcow2
            import_method: web-download
        contexts:
          users:
            tenants: 1
            users_per_tenant: 1
          api_versions:
            glance:
              version: 2
        runner:
          constant:
            times: 1
            concurrency: 1
        sla:
          failure_rate:
            max: 100
